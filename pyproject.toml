[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamelauncher"
version = "0.1.0"
description = "Switch between launch profiles (arguments, env vars, mods, emulators) for games you own"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
gamelauncher = "gamelauncher.cli:main"

[project.gui-scripts]
gamelauncher-gui = "gamelauncher.gui:run_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
